name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk membuat Release berisi APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ekstrak semua file .zip di root repo (kalau ada) sebelum build
      - name: Ekstrak zip
        run: |
          shopt -s nullglob
          for z in ./*.zip; do
            echo "Mengekstrak: $z"
            unzip -oq "$z"
          done
          echo "Isi repo setelah ekstrak:"
          ls -la

      # Cari otomatis folder proyek Gradle (root repo atau subfolder, mis. Droneapk-main/)
      - name: Cari folder proyek
        run: |
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) tidak ditemukan. Isi repo:"; ls -R | head -50; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Folder proyek: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          build-root-directory: ${{ env.PROJECT_DIR }}

      # Kunci Google Maps dari GitHub Secret MAPS_API_KEY (kosong tetap build, peta saja yang tidak tampil)
      - name: Tulis .env
        working-directory: ${{ env.PROJECT_DIR }}
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > .env

      - name: Build APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NexendFly-debug.apk"

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexendFly-debug
          path: NexendFly-debug.apk

      # Setiap push ke main/master juga dipublikasikan sebagai Release
      - name: Publikasikan Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: NexendFly.apk
